name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: VISUAL=1 npx playwright test e2e/specs/visual.spec.ts --update-snapshots
      - name: Commit baselines
        id: commit
        run: |
          git add e2e/specs/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "rejected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update visual baselines"
          if git push origin HEAD; then
            echo "rejected=false" >> "$GITHUB_OUTPUT"
          else
            echo "rejected=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Upload rejected baselines
        if: failure() && steps.commit.outputs.rejected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/specs/visual.spec.ts-snapshots
