name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Compare visual baselines
        run: |
          if [ -d e2e/specs/visual.spec.ts-snapshots ]; then
            VISUAL=1 npx playwright test e2e/specs/visual.spec.ts
          else
            echo "baselines not committed yet"
            exit 0
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
            blob-report/
